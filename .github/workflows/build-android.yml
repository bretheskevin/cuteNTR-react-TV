name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Compute version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VN="${TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VN"
            VC=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            echo "version_name=$VN" >> "$GITHUB_OUTPUT"
            echo "version_code=$VC" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          cd android
          if [[ "${{ steps.version.outputs.has_version }}" == "true" ]]; then
            ./gradlew assembleRelease --no-daemon \
              -PversionName="${{ steps.version.outputs.version_name }}" \
              -PversionCode="${{ steps.version.outputs.version_code }}"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adorableNTR-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
